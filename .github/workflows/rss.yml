name: Update CareerCircle RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Scraper Requirements
      run: |
        pip install beautifulsoup4 feedgenerator playwright
        playwright install chromium
        # Fix: Installs Linux system dependencies required for headless browsers
        playwright install-deps 

    - name: Execute Scraper
      run: python scraper.py

    - name: Commit and Deploy Feed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Automated Feed Update: Sync Remote Change Manager Jobs via Playwright'
        file_pattern: 'feed.xml'
