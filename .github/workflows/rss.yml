name: Update CareerCircle RSS Feed

on:
  schedule:
    - cron: '0 */6 * * *' # Runs automatically every 6 hours
  workflow_dispatch: # Allows you to run it manually anytime

jobs:
  build-and-scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        pip install requests beautifulsoup4 feedgenerator

    - name: Execute Scraper
      run: python scraper.py

    - name: Commit and Deploy Feed
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: 'Automated Feed Update: Sync Remote Change Manager Jobs'
        file_pattern: 'feed.xml'
